version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_USER: drivenow_user
      POSTGRES_PASSWORD: drivenow_password
      POSTGRES_DB: drivenow_default
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../database/postgres_init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - drivenow_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drivenow_user -d drivenow_default"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - drivenow_net
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 5s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - drivenow_net

  vehicle_service:
    build:
      context: ../../src
      dockerfile: vehicle_service/Dockerfile
    container_name: vehicle_service
    environment:
      - DATABASE_URL=postgresql://drivenow_user:drivenow_password@postgres:5432/vehicle_db
      - PYTHONPATH=/app/service/src
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - drivenow_net

  rental_service:
    build:
      context: ../../src
      dockerfile: rental_service/Dockerfile
    container_name: rental_service
    environment:
      - DATABASE_URL=postgresql://drivenow_user:drivenow_password@postgres:5432/rental_db
      - VEHICLE_SERVICE_URL=http://vehicle_service:8000
      - PYTHONPATH=/app/service/src
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - drivenow_net

  return_service:
    build:
      context: ../../src
      dockerfile: return_service/Dockerfile
    container_name: return_service
    environment:
      - RABBITMQ_URI=amqp://guest:guest@rabbitmq:5672/
      - RENTAL_SERVICE_URL=http://rental_service:8000
      - VEHICLE_SERVICE_URL=http://vehicle_service:8000
      - PYTHONPATH=/app/service/src
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - drivenow_net

  gateway_service:
    build:
      context: ../../src
      dockerfile: gateway_service/Dockerfile
    container_name: gateway_service
    ports:
      - "8000:8000"
    environment:
      - VEHICLE_SERVICE_URL=http://vehicle_service:8000
      - RENTAL_SERVICE_URL=http://rental_service:8000
      - RETURN_SERVICE_URL=http://return_service:8000
      - RABBITMQ_URI=amqp://guest:guest@rabbitmq:5672/
      - PYTHONPATH=/app/service/src
    depends_on:
      rabbitmq:
        condition: service_healthy
      vehicle_service:
        condition: service_started
      rental_service:
        condition: service_started
      return_service:
        condition: service_started
    networks:
      - drivenow_net

volumes:
  postgres_data:
  prometheus_data:

networks:
  drivenow_net:
    driver: bridge
