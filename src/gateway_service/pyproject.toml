[project]
name = "gateway-service"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.136.3",
    "httpx>=0.28.1",
    "pika>=1.4.1",
    "prometheus-fastapi-instrumentator>=8.0.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "pytest>=9.0.3",
    "sqlalchemy>=2.0.50",
    "uvicorn>=0.49.0",
    "utils",
]

[tool.uv.sources]
utils = { path = "../utils" }

[tool.pytest.ini_options]
pythonpath = ["src"]

