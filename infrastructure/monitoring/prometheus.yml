global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'gateway_service'
    static_configs:
      - targets: ['gateway_service:8000']

  - job_name: 'vehicle_service'
    static_configs:
      - targets: ['vehicle_service:8000']

  - job_name: 'rental_service'
    static_configs:
      - targets: ['rental_service:8000']

  - job_name: 'return_service'
    static_configs:
      - targets: ['return_service:8000']
